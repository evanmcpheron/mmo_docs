name: One-time visual documentation regeneration
on:
  push:
    branches:
      - docs/visual-requirements-cleanup-20261020

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update authoritative documentation and regenerate published pages
        run: |
          python3 -m py_compile scripts/revise_visual_docs.py
          python3 scripts/revise_visual_docs.py
          python3 scripts/build_development_roadmap.py
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          registry = json.loads(Path('sources/data-inventory.json').read_text(encoding='utf-8'))
          reviewed = {page['page'] for page in registry['pages']}
          command = ['python3', 'scripts/build_data_inventory.py', '--review-roadmap']
          for path in ('guide/decisions.html', 'guide/interface.html', 'guide/testing.html', 'guide/sources.html'):
              if path in reviewed:
                  command.extend(('--review-page', path))
          print('Inventory review:', ' '.join(command), flush=True)
          subprocess.run(command, check=True)
          PY
      - name: Validate generation and dependencies
        run: |
          python3 scripts/build_development_roadmap.py --check
          python3 scripts/build_data_inventory.py --check
          python3 validation/check_development_roadmap.py
          python3 validation/check_data_inventory.py
          python3 -m unittest discover -s validation -p 'test_*.py'
          python3 validation/run_checks.py
          node validation/check_inventory_browser.mjs
      - name: Remove temporary tooling, audit tracked files, and commit result
        run: |
          rm scripts/revise_visual_docs.py .github/workflows/run-visual-cleanup.yml
          rm -rf scripts/__pycache__
          git add -A
          python3 - <<'PY'
          import pathlib
          import subprocess

          forbidden = tuple(bytes.fromhex(value) for value in (
              '736861646572',
              '686c736c',
              '676c736c',
          ))
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          violations = []
          for encoded in paths:
              if not encoded:
                  continue
              path = pathlib.Path(encoded.decode())
              content = path.read_bytes().lower()
              if any(word in encoded.lower() or word in content for word in forbidden):
                  violations.append(str(path))
          if violations:
              raise SystemExit('Forbidden references in tracked files: ' + ', '.join(violations))
          print('Forbidden reference count: 0 across tracked paths and contents')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove specialized rendering requirements and rebuild reference"
          git push origin HEAD:docs/visual-requirements-cleanup-20261020
