name: Validate Briarwake documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated outputs and regression tests
        run: |
          python3 scripts/build_development_roadmap.py --check
          python3 scripts/build_data_inventory.py --check
          python3 validation/check_development_roadmap.py
          python3 validation/check_data_inventory.py
          python3 -m unittest discover -s validation -p 'test_*.py'
          python3 validation/run_checks.py
      - name: Verify offline navigation, search, layout and print
        run: node validation/check_inventory_browser.mjs
      - name: Audit tracked technical references
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          forbidden = (bytes.fromhex('676f646f74'), bytes.fromhex('6764736372697074'))
          tracked_paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          violations = []
          for path_bytes in tracked_paths:
              if not path_bytes:
                  continue
              path = pathlib.Path(path_bytes.decode())
              path_content = path.read_bytes().lower()
              if any(term in path_bytes.lower() or term in path_content for term in forbidden):
                  violations.append(str(path))
          if violations:
              raise SystemExit('Forbidden references: ' + ', '.join(violations))
          print('Forbidden reference count: 0 in tracked paths and contents')
          PY
      - name: Retain browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: validation/data-inventory-browser-checks.json
