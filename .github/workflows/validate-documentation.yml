name: Validate Briarwake documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned formatter
        run: npm ci
      - name: Focused PR verification; static checks and affected freshness
        if: github.event_name != 'workflow_dispatch'
        run: python3 validation/validate.py --gate --base ${{ github.event.pull_request.base.sha || github.event.before }} --report-dir .git/validation-evidence
      - name: Intentional comprehensive documentation regression
        if: github.event_name == 'workflow_dispatch'
        run: python3 validation/validate.py --mode full --gate --report-dir .git/validation-evidence
