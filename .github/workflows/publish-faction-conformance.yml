name: Publish reviewed faction conformance
on:
  push:
    branches: [docs/faction-allegiance-campaign]
    paths: [.github/workflows/publish-faction-conformance.yml]
permissions:
  contents: write
concurrency:
  group: faction-documentation-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'evanmcpheron/mmo_docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and verify the reviewed conformance patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import time
          import urllib.request

          repository = 'evanmcpheron/mmo_docs'
          branch = 'docs/faction-allegiance-campaign'
          main_commit = '468d9430b5492ee5b6d1777ae021b59085c7a507'
          reviewed_parent = 'e9921e2aec167e69f108b5118419ffa0c567af20'
          blob_id = '8b16be411e8e922c10ea24a25f8e8e73533f7f4b'
          payload_digest = '950d431b31088c4ba60d0a1c887b660b609d3c510be17ec2aa3fe94041d48481'
          workflow_path = '.github/workflows/publish-faction-conformance.yml'
          temporary_directory = pathlib.Path(os.environ['RUNNER_TEMP'])

          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True) == ''
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == reviewed_parent
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == main_commit
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          request = urllib.request.Request('https://api.github.com/repos/' + repository + '/git/blobs/' + blob_id, headers=headers)
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          assert blob['sha'] == blob_id and blob['encoding'] == 'base64'
          compressed = base64.b64decode(blob['content'])
          assert hashlib.sha256(compressed).hexdigest() == payload_digest
          package = json.loads(lzma.decompress(compressed))
          assert package['reviewed_parent'] == reviewed_parent
          assert package['main_commit'] == main_commit
          hashes = package['sha256']
          assert len(hashes) == 13
          assert all(not pathlib.PurePosixPath(path).is_absolute() and '..' not in pathlib.PurePosixPath(path).parts for path in hashes)
          patch_path = temporary_directory / 'faction-reviewed.patch'
          patch_path.write_text(package['patch'], encoding='utf-8')
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)

          commands = [
              (['python3', 'tools/build_manual_indexes.py'], 0),
              (['python3', 'tools/build_manual_indexes.py', '--check'], 0),
              (['python3', 'tools/validate_documentation.py'], 0),
              (['python3', 'tools/check_phase_integration.py'], 0),
              (['python3', 'tools/check_feature_coverage.py'], 0),
              (['python3', 'tools/simulate_population_scaling.py'], 0),
              (['python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'], 0),
              (['python3', 'tools/check_feature_coverage.py', '--require-complete'], 1),
              (['python3', 'tools/validate_factions.py'], 0),
              (['python3', 'tools/validate_factions.py', '--deployment'], 1),
              (['git', 'diff', '--check'], 0),
          ]
          results = []
          logs = []
          for command, expected in commands:
              started = time.monotonic()
              result = subprocess.run(command, capture_output=True, text=True)
              output = result.stdout + result.stderr
              logs.append('$ ' + ' '.join(command) + '\n' + output + '\nEXIT=' + str(result.returncode))
              print(logs[-1], flush=True)
              results.append({'command': command, 'exit_code': result.returncode, 'expected_exit_code': expected, 'duration_seconds': round(time.monotonic() - started, 3)})
          mismatches = [path for path, digest in hashes.items() if not pathlib.Path(path).is_file() or hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != digest]
          report = {
              'schema_version': 1,
              'scope': 'Fresh Linux documentation/schema/SQLite conformance; no Unreal or production multiplayer execution',
              'run_url': 'https://github.com/' + repository + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'main_commit': main_commit,
              'reviewed_parent_commit': reviewed_parent,
              'reviewed_local_commit': package['local_review_commit'],
              'matched_reviewed_files': len(hashes) - len(mismatches),
              'hash_mismatches': mismatches,
              'commands': results,
              'expected_nonpassing_gates': ['Unmodified full-guide completeness gate: 46 incomplete requirement blocks', 'Missing cooked-content and solo-runtime faction deployment proof'],
              'runtime': 'not_run',
              'passed': not mismatches and all(row['exit_code'] == row['expected_exit_code'] for row in results),
          }
          report_path = pathlib.Path('verification/faction-review-ci-checks.json')
          log_path = pathlib.Path('verification/faction-review-ci-output.txt')
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          log_path.write_text('\n\n'.join(logs) + '\n', encoding='utf-8')
          (temporary_directory / 'faction-review-ci-checks.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          assert report['passed'], report

          # Remove the one-use transport; only reviewed documentation and test evidence remain.
          pathlib.Path(workflow_path).unlink()
          allowed = set(hashes) | {str(report_path), str(log_path), workflow_path}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: verify faction readiness and reject unknown NPC allegiance', '-m', 'Reviewed source and generated bytes match local commit ' + package['local_review_commit'] + '; records fresh CI evidence. No game runtime implementation.'], check=True)
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == main_commit, 'main advanced; publication stopped'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          subprocess.run(['git', 'bundle', 'create', str(temporary_directory / 'faction-review-published.bundle'), 'HEAD', 'refs/remotes/origin/main'], check=True)
          print('PUBLISHED_HEAD=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
      - name: Preserve conformance publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faction-conformance-review-evidence
          path: |
            ${{ runner.temp }}/faction-review-published.bundle
            ${{ runner.temp }}/faction-review-ci-checks.json
            verification/faction-review-ci-output.txt
          retention-days: 7
          if-no-files-found: warn
