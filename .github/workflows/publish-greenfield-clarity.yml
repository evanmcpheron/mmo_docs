name: Publish reviewed greenfield documentation
on:
  push:
    branches: [docs/greenfield-project-clarity]
    paths: [.github/workflows/publish-greenfield-clarity.yml]
permissions:
  contents: write
concurrency:
  group: greenfield-documentation-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'evanmcpheron/mmo_docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply reviewed source deltas and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import time
          import urllib.request
          
          repository = 'evanmcpheron/mmo_docs'
          branch = 'docs/greenfield-project-clarity'
          main_commit = '8e4cf28fdf20ba5b86fa82ca962216687e9dd21b'
          reviewed_commit = 'ca5af72eb04c234022f759aa3bdec6e9bcd32a58'
          blob_identifiers = [
              '6d44007cfb62b1352a55fc4fb528b8343b725cec',
              '8ff79ca5f40e4a24cfa2499eedfa3719987033a4',
              'fa4bb6ffd05c51122a38544ff42aa96455a2bfed',
              'f50f670891e38f613aa628aee73afacec1f71798',
          ]
          payload_digest = '17c9c7913a21f8e844549af1354a194854adfe0a4828fe053356339be1a8061b'
          workflow_path = '.github/workflows/publish-greenfield-clarity.yml'
          temporary_directory = Path(os.environ['RUNNER_TEMP'])
          
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True) == ''
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == main_commit
          assert subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines() == [workflow_path]
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == main_commit
          
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          compressed_parts = []
          for blob_identifier in blob_identifiers:
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/git/blobs/' + blob_identifier, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == blob_identifier and blob['encoding'] == 'base64'
              compressed_parts.append(base64.b64decode(blob['content']))
          compressed = b''.join(compressed_parts)
          assert len(compressed) == 38652
          assert hashlib.sha256(compressed).hexdigest() == payload_digest
          package = json.loads(lzma.decompress(compressed))
          assert package['main_commit'] == main_commit
          assert package['local_review_commit'] == reviewed_commit
          hashes = package['sha256']
          assert len(package['files']) == 26 and len(hashes) == 128
          for relative_path in hashes:
              path = PurePosixPath(relative_path)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not str(path).startswith('.github/')
              assert path.suffix not in {'.cpp', '.h', '.cs', '.uproject', '.uasset', '.umap'}
          for relative_path, change in package['files'].items():
              assert relative_path in hashes
              path = Path(relative_path)
              if change['base_sha256'] is None:
                  assert not path.exists()
                  original = b''
              else:
                  original = path.read_bytes()
                  assert hashlib.sha256(original).hexdigest() == change['base_sha256'], relative_path
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == hashes[relative_path], relative_path
          
          commands = [
              (['python3', 'tools/build_manual_indexes.py'], 0),
              (['python3', 'tools/build_manual_indexes.py', '--check'], 0),
              (['python3', 'tools/validate_documentation.py'], 0),
              (['python3', 'tools/check_phase_integration.py'], 0),
              (['python3', 'tools/check_feature_coverage.py'], 0),
              (['python3', 'tools/simulate_population_scaling.py'], 0),
              (['python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'], 0),
              (['python3', 'tools/validate_factions.py'], 0),
              (['python3', 'tools/check_feature_coverage.py', '--require-complete'], 1),
              (['python3', 'tools/validate_factions.py', '--deployment'], 1),
              (['git', 'diff', '--check'], 0),
          ]
          results = []
          logs = []
          for command, expected_exit in commands:
              started = time.monotonic()
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              output = result.stdout + result.stderr
              logs.append('$ ' + ' '.join(command) + '\n' + output + '\nEXIT=' + str(result.returncode))
              print(logs[-1], flush=True)
              results.append({'command': command, 'exit_code': result.returncode, 'expected_exit_code': expected_exit, 'duration_seconds': round(time.monotonic() - started, 3)})
          
          mismatches = [path for path, digest in hashes.items() if not Path(path).is_file() or hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest]
          master_digest = hashlib.sha256(Path('sources/MASTER_PROMPT.original.md').read_bytes()).hexdigest()
          assert master_digest == 'd00bd180dbc6daa8c8e8c5bc14fee4b7fecac4590e1773443f79017319c4b8cb'
          report = {
              'schema_version': 1,
              'scope': 'Fresh Linux documentation generation, registries, links and Python/SQLite tests; no Unreal or production multiplayer execution',
              'run_url': 'https://github.com/' + repository + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'main_commit': main_commit,
              'reviewed_local_commit': reviewed_commit,
              'matched_reviewed_files': len(hashes) - len(mismatches),
              'hash_mismatches': mismatches,
              'reviewed_sha256': hashes,
              'historical_master_sha256': master_digest,
              'commands': results,
              'expected_incomplete_gates': ['Full-guide completion remains incomplete', 'Faction deployment lacks cooked-content and solo-runtime evidence'],
              'browser': 'Not rerun in this CI job. Committed greenfield browser/render reports are bounded local evidence; file and local-HTTP navigation were blocked, not passed.',
              'other_repositories_modified': False,
          }
          report_text = json.dumps(report, indent=2) + '\n'
          Path('verification/greenfield-ci-checks.json').write_text(report_text, encoding='utf-8')
          Path('verification/greenfield-ci-output.txt').write_text('\n\n'.join(logs) + '\n', encoding='utf-8')
          (temporary_directory / 'greenfield-ci-checks.json').write_text(report_text, encoding='utf-8')
          assert all(item['exit_code'] == item['expected_exit_code'] for item in results), 'Unexpected check result'
          assert not mismatches, mismatches
          assert any('Ran 101 tests' in log and '\nOK\n' in log for log in logs), 'Expected test inventory not observed'
          
          Path(workflow_path).unlink()
          allowed = set(hashes) | {'verification/greenfield-ci-checks.json', 'verification/greenfield-ci-output.txt', workflow_path}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == allowed, {'unexpected': sorted(changed - allowed), 'missing': sorted(allowed - changed)}
          subprocess.run(['git', 'add', '--'] + sorted(allowed), check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: clarify greenfield Briarwake development workflow', '-m', 'Publish regenerated documentation matching local review ' + reviewed_commit + '. Preserve the existing RPG project/module and all gameplay contracts; no game or historical repository changes.'], check=True)
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == main_commit
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          subprocess.run(['git', 'bundle', 'create', str(temporary_directory / 'greenfield-published.bundle'), 'HEAD', 'refs/remotes/origin/main'], check=True)
          print('PUBLISHED_HEAD=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), flush=True)
          PY
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenfield-documentation-review-evidence
          path: |
            ${{ runner.temp }}/greenfield-published.bundle
            ${{ runner.temp }}/greenfield-ci-checks.json
            verification/greenfield-ci-output.txt
          retention-days: 7
          if-no-files-found: warn
