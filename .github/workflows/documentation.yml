name: Documentation validation
on:
  push:
    branches: [main, 'art-bible/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original Art Bible references
        run: python3 tools/create_art_references.py --check
      - name: Validate Art Bible sources and exports
        run: python3 tools/validate_art_bible.py
      - name: Check generated manual
        run: python3 tools/build_manual_indexes.py --check
      - name: Validate documentation
        run: python3 tools/validate_documentation.py
      - name: Check phase integration
        run: python3 tools/check_phase_integration.py
      - name: Check feature coverage
        run: python3 tools/check_feature_coverage.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Package documentation for review
        if: always()
        run: git archive --format=zip HEAD -o /tmp/briarwake-documentation.zip
      - name: Retain review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briarwake-documentation
          path: /tmp/briarwake-documentation.zip
          retention-days: 14
  art-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser QA dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise offline Art Bible at desktop and mobile sizes
        run: python3 tools/art_browser_checks.py --output /tmp/briarwake-art-browser
      - name: Retain rendered pages, print sample and interaction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briarwake-art-browser
          path: /tmp/briarwake-art-browser
          retention-days: 14
