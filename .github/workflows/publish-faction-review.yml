name: Publish reviewed faction documentation
on:
  push:
    branches: [docs/faction-allegiance-campaign]
    paths: [.github/workflows/publish-faction-review.yml]
permissions:
  contents: write
concurrency:
  group: faction-documentation-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'evanmcpheron/mmo_docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed sources from immutable Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repository = 'evanmcpheron/mmo_docs'
          branch = 'docs/faction-allegiance-campaign'
          base = '468d9430b5492ee5b6d1777ae021b59085c7a507'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True) == ''
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == base
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          blob_ids = ['5d3dbb86a1a2e6e935ec25b79f968714549ed89b', 'fa9e469ac1ec49d4ca30ddde4cac7e446f84380d', '9162bf254dc9647d7c4649a702a63af4493b2aa5', 'b0786926a6d34418f6d33da7b3eab6644657d496', '88bc5978a6342464216104d5e328ac529581da34', '9581d5bcca895c0f75be9bfdd88c3940254bd552', 'e5b26bb02ecd8cc0c5a8849faa96116c32daf1b9', '38b5d0ae58b8449c5b56b4a3eff96e115314f674', '28afe42e1dc6f328cc0a12ed517a70347881829a', 'd35766922a38360467893af190b30c7dcb6236cb', '888a2b067ec0d9e971d88f3cc627e7771a315a29', '4fbb4fca2aee4c0c6f8dd4892911fb7771732fbb', '07915231659a97931f1e8b6dfd681b71d022ba0b']
          segments = []
          for blob_id in blob_ids:
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/git/blobs/' + blob_id, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == blob_id and blob['encoding'] == 'base64'
              segment = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(segment)).encode() + b'\0' + segment).hexdigest() == blob_id
              segments.append(segment)
          compressed = b''.join(segments)
          assert hashlib.sha256(compressed).hexdigest() == '44f28e7e0cca2ebe882b4f8969d2c9c851e7fe2c4eb6047ceef365855f332d81'
          raw = lzma.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == 'b6e1aeafd64c3daea826c3d72122dfdf4ec8db9f401a4fad6f241d21f3d01b13'
          package = json.loads(raw)
          assert package['base'] == base and len(package['files']) == 39 and len(package['generated_sha256']) == 136
          root = pathlib.Path.cwd().resolve()
          def checked_path(relative):
              path = (root / relative).resolve()
              assert path.is_relative_to(root) and not relative.startswith('.') and '..' not in pathlib.PurePosixPath(relative).parts
              return path
          for record in package['files']:
              path = checked_path(record['path'])
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == record['before'], record['path']
              if record['kind'] == 'json':
                  value = json.loads(before) if before is not None else None
                  for action, components, *arguments in record['operations']:
                      target = value
                      if action in ['set', 'delete']:
                          if not components:
                              assert action == 'set'
                              value = arguments[0]
                              continue
                          for component in components[:-1]:
                              target = target[component]
                          if action == 'set':
                              target[components[-1]] = arguments[0]
                          else:
                              del target[components[-1]]
                      else:
                          for component in components:
                              target = target[component]
                          if action == 'extend':
                              target.extend(arguments[0])
                          elif action == 'truncate':
                              del target[arguments[0]:]
                          else:
                              raise ValueError(action)
                  after = (json.dumps(value, ensure_ascii=record['ascii'], indent=2) + '\n').encode()
              else:
                  assert record['kind'] == 'text'
                  after = record['content'].encode()
              assert hashlib.sha256(after).hexdigest() == record['after'], record['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'faction-delivery.json').write_bytes(raw)
          print('Applied 39 reviewed source/report files; all before/after hashes matched.')
          PY
      - name: Verify, record, and publish on the task branch only
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          package = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'faction-delivery.json').read_text())
          commands = [
              (['python3', 'tools/build_manual_indexes.py'], 0),
              (['python3', 'tools/build_manual_indexes.py', '--check'], 0),
              (['python3', 'tools/validate_documentation.py'], 0),
              (['python3', 'tools/check_phase_integration.py'], 0),
              (['python3', 'tools/check_feature_coverage.py'], 0),
              (['python3', 'tools/simulate_population_scaling.py'], 0),
              (['python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'], 0),
              (['python3', 'tools/check_feature_coverage.py', '--require-complete'], 1),
              (['python3', 'tools/validate_factions.py'], 0),
              (['python3', 'tools/validate_factions.py', '--deployment'], 1),
              (['git', 'diff', '--check'], 0),
          ]
          results, logs = [], []
          for command, expected in commands:
              result = subprocess.run(command, capture_output=True, text=True)
              output = result.stdout + result.stderr
              logs.append('$ ' + ' '.join(command) + '\n' + output + '\nEXIT=' + str(result.returncode))
              print(logs[-1], flush=True)
              results.append({'command': command, 'exit_code': result.returncode, 'expected_exit_code': expected})
          hashes = dict(package['generated_sha256'])
          hashes.update({record['path']: record['after'] for record in package['files']})
          mismatches = [path for path, digest in hashes.items() if not pathlib.Path(path).is_file() or hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != digest]
          report = {
              'schema_version': 1,
              'scope': 'Fresh Linux documentation/schema/SQLite conformance only; no Unreal or multiplayer execution',
              'run_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'base_commit': package['base'], 'reviewed_local_commit': package['local_commit'],
              'matched_reviewed_files': len(hashes) - len(mismatches), 'hash_mismatches': mismatches,
              'commands': results,
              'expected_nonpassing_gates': ['Unmodified full-guide completeness gate', 'Missing cooked-content and solo-runtime deployment proof'],
              'runtime': 'not_run',
              'passed': not mismatches and all(row['exit_code'] == row['expected_exit_code'] for row in results)
          }
          pathlib.Path('verification/faction-ci-checks.json').write_text(json.dumps(report, indent=2) + '\n')
          pathlib.Path('verification/faction-ci-output.txt').write_text('\n\n'.join(logs) + '\n')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'faction-ci-checks.json').write_text(json.dumps(report, indent=2) + '\n')
          assert report['passed'], report
          # The transport workflow is one-use; retain no workflow or payload files in the delivered tree.
          pathlib.Path('.github/workflows/publish-faction-review.yml').unlink()
          allowed = set(hashes) | {'verification/faction-ci-checks.json', 'verification/faction-ci-output.txt', '.github/workflows/publish-faction-review.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: add four-faction contracts and Hearthward campaign with conformance tests', '-m', 'Content matches reviewed local commit ' + package['local_commit'] + '; adds fresh CI evidence. No game runtime implementation.'], check=True)
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip() == package['base'], 'main advanced; publication stopped'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/docs/faction-allegiance-campaign'], check=True)
          subprocess.run(['git', 'bundle', 'create', os.path.join(os.environ['RUNNER_TEMP'], 'faction-published.bundle'), 'HEAD', 'refs/remotes/origin/main'], check=True)
          print('PUBLISHED_HEAD=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faction-publication-evidence
          path: |
            ${{ runner.temp }}/faction-published.bundle
            ${{ runner.temp }}/faction-ci-checks.json
            verification/faction-ci-output.txt
          retention-days: 7
          if-no-files-found: warn
