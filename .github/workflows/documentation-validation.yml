name: Documentation validation
on:
  push:
    branches: [docs/shared-realms-cooperative-adventures]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical documentation
        run: |
          python3 tools/build_manual_indexes.py --check
          python3 tools/validate_documentation.py
          python3 tools/check_phase_integration.py
          python3 tools/check_feature_coverage.py
          python3 tools/simulate_population_scaling.py
          python3 -m unittest discover -s tools/tests -v
      - name: Package review snapshot
        if: always()
        run: git archive --format=tar HEAD > documentation-snapshot.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-review-snapshot
          path: |
            documentation-snapshot.tar
            verification/
          retention-days: 7
